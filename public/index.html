<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>محادثتي</title>

<!-- إعدادات PWA: تسمح للمستخدم يثبت الموقع كتطبيق من المتصفح -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7A4FE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="محادثتي">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شاشة إدخال الاسم (أول مرة فقط) -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-mark">م</div>
      <h1>محادثتي</h1>
      <p>اكتب اسمك عشان نجهز مساحتك الخاصة بالمحادثات</p>
      <input id="nameInput" type="text" placeholder="اسمك هنا..." autocomplete="off">
      <button id="startBtn">ابدأ</button>
    </div>
  </div>

  <!-- واجهة التطبيق الرئيسية -->
  <div id="appScreen" class="app-shell" style="display:none;">

    <!-- الشريط الجانبي -->
    <aside class="sidebar">
      <button id="newChatBtn" class="new-chat-btn">
        <span class="plus">+</span> محادثة جديدة
      </button>
      <div id="convList" class="conv-list"></div>
      <div class="sidebar-footer">
        <span id="userNameLabel"></span>
        <button id="installBtn" class="install-btn" style="display:none;">
          تثبيت التطبيق
        </button>
      </div>
    </aside>

    <!-- طبقة تعتيم خلف القائمة الجانبية عند فتحها بالجوال -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- منطقة المحادثة -->
    <main class="chat-area">
      <!-- شريط علوي يظهر فقط على الجوال -->
      <div class="mobile-topbar">
        <button id="menuToggleBtn" class="menu-toggle-btn" aria-label="القائمة">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <span class="mobile-topbar-title">محادثتي</span>
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-mark">م</div>
        <h2>وش بخاطرك اليوم؟</h2>
        <p>ابدأ محادثة جديدة من الشريط الجانبي أو اكتب رسالتك مباشرة</p>
      </div>

      <div id="messagesWrap" class="messages-wrap" style="display:none;"></div>

      <div class="composer">
        <!-- معاينة الصورة المختارة قبل الإرسال -->
        <div id="imagePreviewWrap" class="image-preview-wrap" style="display:none;">
          <img id="imagePreview" alt="صورة مرفقة">
          <button id="removeImageBtn" type="button" class="remove-image-btn" aria-label="إزالة الصورة">✕</button>
        </div>

        <form id="composerForm">
          <button id="attachBtn" type="button" class="attach-btn" aria-label="إرفاق صورة">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M21 12.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="8" cy="9" r="1.5" stroke="currentColor" stroke-width="2"/>
              <path d="M3 15l4.5-4.5a2 2 0 0 1 2.8 0L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M17 15v6M14 18h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <input id="imageInput" type="file" accept="image/*" style="display:none;">
          <textarea id="messageInput" placeholder="اكتب رسالتك..." rows="1"></textarea>
          <button id="sendBtn" type="submit" aria-label="إرسال">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    // تسجيل الـ Service Worker (شرط أساسي عشان يقدر المستخدم يثبت الموقع كتطبيق)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    // إظهار زر "تثبيت التطبيق" عند توفر الإمكانية (أندرويد/كروم)
    let deferredInstallPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (installBtn) installBtn.style.display = 'block';
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        installBtn.style.display = 'none';
      });
    }

    window.addEventListener('appinstalled', () => {
      if (installBtn) installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
